name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content -Raw UltimateMacro.csproj)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "tag=v$version" >> $env:GITHUB_OUTPUT
          $published = gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list published versions.' }
          "exists=$(([bool]($published -contains "v$version")).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        if: steps.version.outputs.exists == 'false'
        with:
          dotnet-version: '10.0.x'

      - name: Build portable package
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./Build.ps1 -Package

      - name: Publish Windows download
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG release/UltimateMacro-Windows-x64.zip --target $env:GITHUB_SHA --title "Ultimate Macro $env:RELEASE_TAG" --notes 'Extract the ZIP and open UltimateMacro.exe on Windows 10/11 x64. The portable package includes the .NET runtime.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the Windows release.' }

      - name: Verify downloadable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $asset = gh release view $env:RELEASE_TAG --json assets --jq '.assets[] | select(.name == "UltimateMacro-Windows-x64.zip") | .size'
          if ($LASTEXITCODE -ne 0 -or [long]$asset -le 0) { throw 'The Windows ZIP is missing from the release.' }
